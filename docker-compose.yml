services:
  api_condominio:
    build:
      context: .
      dockerfile: CondominioSaaS.API/Dockerfile
    container_name: api_condominio
    restart: unless-stopped
    ports:
      - "5004:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ApplicationDbContext: >
        Server=sqlserver2022,1433;
        Database=Condominio_aspnet;
        User Id=sa;
        Password=Senh@Forte2026!;
        Encrypt=False;
        TrustServerCertificate=True;
        MultipleActiveResultSets=true
      Jwt__Key: wedaf7d4563b48e197b1507d492b708eSuperSecretKey2026
      Jwt__Issuer: CondominioSaaS.API
      Jwt__Audience: CondominioSaaS.API
      Jwt__ExpireMinutes: 15
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: guest
      RabbitMq__Password: guest
      RabbitMq__ExchangeName: email_exchange
      RabbitMq__QueueName: fila_emails
      RabbitMq__DeadLetterQueue: fila_emails_erro
      RabbitMq__DeadLetterExchange: dlx_exchange
      AdminSettings__UserName: Admin
      AdminSettings__Email: emailadmin@gmail.com
      AdminSettings__Password: 12345
      Security__EncryptionKey: MinhaChaveDeCriptografiaSuperSecreta
      Cors__AllowedOrigins: http://localhost:3000,https://localhost:300,http://condominio_front_react:3000,http://localhost:4200,https://localhost:4200,http://condominio_front_angular:4200
      Logging__LogLevel__Default: Information
      Logging__LogLevel__Microsoft: Warning
    volumes:
      - ./keys:/home/app/.aspnet/DataProtection-Keys
    networks:
      - infra_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker_condominio:
    build:
      context: .
      dockerfile: CondominioSaaS.Worker/Dockerfile
    container_name: worker_condominio
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      RabbitMq__Host: rabbitmq
      RabbitMq__UserName: guest
      RabbitMq__Password: guest
      RabbitMq__Port: 5672
      RabbitMq__ExchangeName: email_exchange
      RabbitMq__QueueName: fila_emails
      RabbitMq__DeadLetterExchange: dlx_exchange
      RabbitMq__DeadLetterQueue: fila_emails_erro
    depends_on:
      api_condominio:
        condition: service_healthy
    networks:
      - infra_net

networks:
  infra_net:
    external: true
    name: infra_net
    driver: bridge
